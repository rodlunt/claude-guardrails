name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shell syntax
        run: |
          for f in bin/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
            echo "syntax OK: $f"
          done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning bin/*.sh tests/*.sh

      - name: Settings policy is valid JSON and declares keys
        run: |
          jq empty claude-core/settings-policy.json
          test "$(jq 'del(._comment) | length' claude-core/settings-policy.json)" -gt 0 \
            || { echo "policy declares no keys"; exit 1; }
          echo "policy OK"

      - name: Guard test suites
        run: |
          tests/test-guard-git-push.sh
          tests/test-guard-repo-collision.sh
          tests/test-guard-repo-collision-peers.sh
          tests/test-peer-ack.sh

      - name: Python syntax (MCP server)
        run: |
          python3 -m py_compile mcp/peer-ack/server.py
          echo "python syntax OK: mcp/peer-ack/server.py"

      - name: Guards must be executable, or the hooks silently never run
        run: |
          for f in bin/guard-git-push.sh bin/guard-repo-collision.sh bin/peer-ack.sh bin/peer-ack-hook.sh; do
            test -x "$f" || { echo "$f is not executable"; exit 1; }
            echo "exec bit OK: $f"
          done
